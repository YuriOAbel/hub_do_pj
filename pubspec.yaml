name: consulta_cnpj_new
description: Consulta CNPJ — cadastral lookup for Brazilian companies.
publish_to: 'none'
version: 4.0.6+56

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  google_fonts: ^6.2.1
  sizer: ^3.0.5
  flutter_svg: ^2.0.17
  auto_size_text: ^3.0.0
  loading_animation_widget: ^1.3.0
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  dio: ^5.8.0+1
  cpf_cnpj_validator: ^2.0.0
  mask_text_input_formatter: ^2.9.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  maps_launcher: ^3.0.0+1
  printing: ^5.14.2
  pdf: ^3.12.0
  screenshot: ^3.0.0
  in_app_review: ^2.0.10
  permission_handler: ^11.4.0
  # FlutterFire pin: 4.8+/16.2.1+/12.4+/6.5+/5.2+ break (FirebasePlugin missing
  # from published firebase_core_platform_interface). Keep pi ^6.0.3 set.
  firebase_core: ">=4.7.0 <4.8.0"
  firebase_analytics: ">=12.3.0 <12.4.0"
  firebase_messaging: ">=16.2.0 <16.2.1"
  firebase_remote_config: ">=6.4.0 <6.5.0"
  firebase_crashlytics: ">=5.1.0 <5.2.0"
  # Test Store (`test_` key) requires Flutter SDK >= 9.8.0
  purchases_flutter: ^9.10.7
  flutter_contacts: ^1.1.9+2
  intl: ^0.20.2
  package_info_plus: ^8.3.0
  currency_text_input_formatter: ^2.2.9
  tutorial_coach_mark: ^1.3.3
  supabase: ^2.10.4
  # 12.4+ calls isiOSAppOnVision (needs Xcode >= 26.1.1). Pin until Xcode upgrade.
  device_info_plus: 12.3.0
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/images/
    - assets/config/
